<!doctype html><html><head><meta charset="utf-8"><title>D2 browser mock IPC evidence</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="app" title="Real application with browser-only test data" src="/#/pokedex"></iframe>
<script type="module">
const frame=document.querySelector('iframe');
const dimensions=new URLSearchParams(location.search);
if(dimensions.has('width')) {frame.style.width=dimensions.get('width')+'px';frame.style.height=dimensions.get('height')+'px';}
frame.addEventListener('load',async()=>{
  const win=frame.contentWindow;
  await win.eval("// T13D2 BROWSER-ONLY visual fixture. Never imported by app/src or production.\n// Existing API shapes only. Not a PTU rules oracle or persistence evidence.\n(async () => {\n  const { mockIPC } = await import('/node_modules/@tauri-apps/api/mocks.js');\n  const definitions = {};\n  const species = [\n    ['eevee','Eevee',['Normal']], ['vulpix','Vulpix',['Fire']],\n    ['bulbasaur','Bulbasaur',['Grass','Poison']], ['psyduck','Psyduck',['Water']],\n    ['mareep','Mareep',['Electric']], ['murkrow','Murkrow',['Dark','Flying']]\n  ];\n  for (const [id,name,types] of species) definitions[id] = {\n    definition_version_id:`species:${id}@core`, logical_id:id, name,\n    content_pack_id:'ptu-core-1.05', reason:'priority', needs_review:false,\n    data_json:JSON.stringify({types,base_stats:{},record_kind:'species',\n      raw_text:'Visual fixture. Imported mechanical data remains incomplete.',\n      missing_mechanical_fields:['base_stats']})\n  };\n  definitions.tackle = {definition_version_id:'move:tackle@core', logical_id:'tackle', name:'Tackle',\n    content_pack_id:'ptu-core-1.05',reason:'priority',needs_review:false,\n    data_json:JSON.stringify({type:'Normal',class:'Physical',damage_base:4,ac:2,frequency_text:'At-Will',range_text:'Melee, 1 Target',effect_text:'A basic physical attack. Visual fixture for the existing move viewer.'})};\n  const pokemon = species.map(([id],i)=>({id:`d2-p${i}`,species_definition_id:id,nickname:null,\n    level:5+i,exp:null,capture_ball_item_id:null,injuries:0,held_item_id:null,\n    storage_state:'carried',roster_memberships:i<4?['d2-r1']:['d2-r2'],battle_state:null,\n    moves:[{definition_version_id:'move:tackle@core'}],abilities:[],poke_edges:[],capabilities:[]}));\n  const profile = {id:'d2-visual',name:'D2 Visual Trainer',level:1,exp:0,money:1250,\n    background:{name:'Field researcher'},skills:{stealth:{base_rank:'novice'},perception:{base_rank:'adept'},athletics:{base_rank:'untrained'},focus:{base_rank:'untrained'}},\n    gm_grants:[],moves:[],edges:[],features:[],abilities:[],capabilities:[],pokemon,\n    rosters:[{id:'d2-r1',name:'Field Team',active:true,max_members:6,rules:{combat:true}},{id:'d2-r2',name:'Travelling Companions',active:true,max_members:null,rules:{personal_use:true}}],\n    inventory:{backpack:[{item_id:'potion',quantity:2}],storage:[],equipped:{}},\n    npcs:[],progression:[],timeline:[],combat:null,weight_lb:null,\n    stat_allocation:{entries:[{stat:'hp',source:'creation',level:1,points:5,note:null},{stat:'attack',source:'creation',level:1,points:5,note:null}]}};\n  const v = value=>({base:value,final_value:value,breakdown:[]});\n  const core = {combat_stats:{hp:v(15),attack:v(10),defense:v(5),special_attack:v(5),special_defense:v(5),speed:v(5)},max_hp:{base:40,final_value:42,breakdown:[{label:'Visual test source',operation:'add',value:2,resulting_value:42}]},\n    ap:v(5),power:v(4),physical_evasion:v(1),special_evasion:v(1),speed_evasion:v(1),\n    high_jump:v(0),high_jump_running_start_bonus:1,long_jump:v(1),overland:v(4),swim:v(2),throwing_range:v(6),size:'Medium',weight:{weight_lb:null,weight_class:null},validation:[],allocation_summary:{granted:10,spent:10,remaining:0}};\n  const calls = [];\n  mockIPC((cmd,args)=>{\n    calls.push({cmd,args});\n    switch(cmd) {\n      case 'active_ruleset_name': return 'PTU Core 1.05';\n      case 'list_trainers': return [{id:profile.id,name:profile.name,level:profile.level,money:profile.money}];\n      case 'load_trainer': return profile;\n      case 'resolve_definition': return definitions[args.logicalId] ?? null;\n      case 'search_content': return Object.values(definitions).filter(d=>(!args.kind || d.definition_version_id.startsWith(args.kind+':')) && (d.name.toLowerCase().includes(args.query.toLowerCase()) || args.query==='all')).slice(args.offset,args.offset+args.limit).map(d=>({...d,kind:d.definition_version_id.split(':')[0]}));\n      case 'resolve_trainer_core_stats': case 'preview_trainer_stat_allocation': return core;\n      case 'save_trainer_stat_allocation': return null; // click wiring only; not persistence\n      case 'resolve_damage': return {stab_applies:true,base_db:4,final_db:6,damage_expression:'2d6 + 8'};\n      case 'add_pokemon': { const p={...pokemon[0],id:'d2-added',species_definition_id:args.speciesDefinitionId,nickname:args.nickname,level:args.level,roster_memberships:[]}; profile.pokemon.push(p);return p; }\n      case 'add_roster_membership': profile.pokemon.find(p=>p.id===args.pokemonId)?.roster_memberships.push(args.rosterId);return null;\n      case 'get_shop': return null;\n      default: throw new Error('No visual fixture for '+cmd);\n    }\n  });\n  window.__d2Evidence = {profile,core,definitions,calls,mode:'browser mock IPC \u2014 composition only'};\n  const { useAppStore } = await import('/src/store/appStore.ts');\n  useAppStore.setState({activeTrainerId:profile.id});\n  window.location.hash = '#/trainer/d2-visual';\n  return {mode:window.__d2Evidence.mode, width:innerWidth,height:innerHeight};\n})()\n");
  const q=new URLSearchParams(location.search);
  win.location.hash=q.get('route')||'#/';
  await new Promise(r=>setTimeout(r,900));
  if(q.get('state')?.startsWith('search')) {
    const input=win.document.querySelector('#search-query');
    Object.getOwnPropertyDescriptor(win.HTMLInputElement.prototype,'value').set.call(input,'all');
    input.dispatchEvent(new win.Event('input',{bubbles:true}));
    await new Promise(r=>setTimeout(r,800));
    if(q.get('state')==='search-detail') {win.document.querySelector('.virtual-row').click();await new Promise(r=>setTimeout(r,500));}
    if(q.get('state')==='search-confirm') {win.document.querySelector('.virtual-row').click();await new Promise(r=>setTimeout(r,500));win.document.querySelector('dialog .btn-primary').click();await new Promise(r=>setTimeout(r,500));}
  }
  if(q.get('state')==='allocation') {Array.from(win.document.querySelectorAll('button')).find(b=>b.textContent.trim()==='Allocate Stat Points').click();await new Promise(r=>setTimeout(r,400));}
  if(q.get('state')==='breakdown') {Array.from(win.document.querySelectorAll('button')).find(b=>b.textContent.includes('Max HP')).click();await new Promise(r=>setTimeout(r,400));}
  if(q.get('state')?.startsWith('moves')) {Array.from(win.document.querySelectorAll('[role=tab]')).find(b=>b.textContent==='Moves').click();await new Promise(r=>setTimeout(r,400));}
  if(q.get('state')==='moves-resolved') {const select=win.document.querySelector('.pokemon-move-resolver select');select.value=select.options[1].value;select.dispatchEvent(new win.Event('change',{bubbles:true}));await new Promise(r=>setTimeout(r,100));win.document.querySelector('.pokemon-move-resolver button[type=submit]').click();await new Promise(r=>setTimeout(r,400));}
  if(q.get('state')==='empty') {win.__d2Evidence.profile.pokemon.splice(0);win.__d2Evidence.profile.rosters.splice(0);win.location.hash='#/trainer/d2-visual';await new Promise(r=>setTimeout(r,100));win.location.hash='#/rosters';await new Promise(r=>setTimeout(r,300));}
  if(q.get('scroll'))win.scrollTo(0,Number(q.get('scroll')));
  const report={route:win.location.hash,state:q.get('state'),mode:'browser mock IPC; NOT persistence',width:win.innerWidth,height:win.innerHeight,dpr:win.devicePixelRatio,scrollWidth:win.document.documentElement.scrollWidth,scrollHeight:win.document.documentElement.scrollHeight,appContent:win.document.querySelector('.app-content').getBoundingClientRect().toJSON(),dialog:win.document.querySelector('dialog[open]')?.getBoundingClientRect().toJSON()};
  document.body.dataset.measurement=JSON.stringify(report);document.body.dataset.ready='true';
});
</script></body></html>
