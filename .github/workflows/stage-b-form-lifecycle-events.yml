name: Stage B Form Lifecycle Events

on:
  workflow_dispatch:
  push:
    branches:
      - content/ptu-parametrized-forms-catalog
    paths:
      - '.github/workflows/stage-b-form-lifecycle-events.yml'
      - 'PTU_Companion_Windows_Source/rules/pokemon-form-events.mjs'
      - 'PTU_Companion_Android_Tauri/www/rules/pokemon-form-events.mjs'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_form_lifecycle_events.py'
      - 'PTU_Companion_Windows_Source/scripts/augment_ptu_form_lifecycle_events.py'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_b_form_lifecycle_events.mjs'

permissions:
  contents: write

jobs:
  lifecycle-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ptu-parametrized-forms-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate transition endpoint
        run: python PTU_Companion_Windows_Source/scripts/apply_stage_b_form_lifecycle_events.py
      - name: Add source lifecycle metadata
        run: python PTU_Companion_Windows_Source/scripts/augment_ptu_form_lifecycle_events.py
      - name: Verify lifecycle transition model
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_form_lifecycle_events.mjs
      - name: Verify Windows regressions
        working-directory: PTU_Companion_Windows_Source
        run: npm run verify
      - name: Verify Android regressions
        working-directory: PTU_Companion_Android_Tauri
        run: npm run verify
      - name: Check lifecycle invariants
        run: |
          cmp PTU_Companion_Windows_Source/rules/pokemon-form-events.mjs PTU_Companion_Android_Tauri/www/rules/pokemon-form-events.mjs
          grep -q 'Runtime requirement model:.*2' docs/PTU_FORMS_STAGE_B.md
          grep -q 'Form lifecycle model:.*1' docs/PTU_FORMS_STAGE_B.md
          grep -q 'Forms with source-explicit lifecycle automation:.*8' docs/PTU_FORMS_STAGE_B.md
          grep -q 'Source-explicit lifecycle event rules:.*24' docs/PTU_FORMS_STAGE_B.md
          grep -q 'aegislash:sword-stance.*damaging Move use enters Sword' docs/PTU_FORMS_STAGE_B.md
          grep -q 'wishiwashi:schooling.*Temporary HP' docs/PTU_FORMS_STAGE_B.md
          grep -q 'eiscue:noice-face.*two Ice Face tick' docs/PTU_FORMS_STAGE_B.md
          grep -q 'zygarde:complete-from-.*scene-end' docs/PTU_FORMS_STAGE_B.md
          grep -q 'zacian:crowned-sword.*zamazenta:crowned-shield' docs/PTU_FORMS_STAGE_B.md
          grep -q "/api/pokemon/forms/transition" PTU_Companion_Windows_Source/server.mjs
          grep -q "/api/pokemon/forms/transition" PTU_Companion_Android_Tauri/www/mobile-api.mjs
          git diff --exit-code -- '*.ptucp'
          git diff --check
      - name: Commit lifecycle runtime integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PTU_Companion_Windows_Source/rules/pokemon-form-events.mjs \
            PTU_Companion_Android_Tauri/www/rules/pokemon-form-events.mjs \
            PTU_Companion_Windows_Source/server.mjs \
            PTU_Companion_Android_Tauri/www/mobile-api.mjs \
            docs/PTU_FORMS_STAGE_B.md \
            docs/data/PTU_FORMS_STAGE_B.json
          if git diff --cached --quiet; then
            echo 'Lifecycle event runtime integration already current.'
          else
            git commit -m 'feat(forms): integrate source lifecycle events [skip ci]'
            git push origin HEAD:content/ptu-parametrized-forms-catalog
          fi
