name: Stage B Combat Self Move Outcomes

on:
  workflow_dispatch:
  push:
    branches:
      - content/ptu-parametrized-forms-catalog
    paths:
      - '.github/workflows/stage-b-combat-self-outcomes.yml'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_self_outcomes.py'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_session_fixups.py'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_move_outcomes.mjs'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_self_outcomes.mjs'
      - 'PTU_Companion_Windows_Source/static-preview/app.js'
      - 'PTU_Companion_Android_Tauri/www/app.js'
      - 'docs/PTU_COMBAT_MOVE_OUTCOMES.md'
      - 'docs/data/PTU_COMBAT_MOVE_OUTCOMES.json'

permissions:
  contents: write

jobs:
  self-outcomes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ptu-parametrized-forms-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-explicit controlled-Pokémon Move outcomes
        run: python PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_self_outcomes.py
      - name: Verify base Move outcome model
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_move_outcomes.mjs
      - name: Verify controlled-Pokémon Move outcomes
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_self_outcomes.mjs
      - name: Verify Windows regressions
        working-directory: PTU_Companion_Windows_Source
        run: npm run verify
      - name: Verify Android regressions
        working-directory: PTU_Companion_Android_Tauri
        run: npm run verify
      - name: Check outcome invariants
        run: |
          grep -q '"schema_version": 2' docs/data/PTU_COMBAT_MOVE_OUTCOMES.json
          grep -q '"physical_dice_only": true' docs/data/PTU_COMBAT_MOVE_OUTCOMES.json
          grep -q 'Close Combat' docs/PTU_COMBAT_MOVE_OUTCOMES.md
          grep -q 'Charge Beam' docs/PTU_COMBAT_MOVE_OUTCOMES.md
          grep -q 'function pokemonCombatChargeBeamRaisesSpAttack' PTU_Companion_Windows_Source/static-preview/app.js
          grep -q 'function pokemonCombatChargeBeamRaisesSpAttack' PTU_Companion_Android_Tauri/www/app.js
          grep -q 'Effect roll · physical d20' PTU_Companion_Windows_Source/static-preview/app.js
          grep -q 'Effect roll · physical d20' PTU_Companion_Android_Tauri/www/app.js
          git diff --exit-code -- '*.ptucp'
          git diff --check
      - name: Commit controlled-Pokémon outcome integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PTU_Companion_Windows_Source/static-preview/app.js \
            PTU_Companion_Android_Tauri/www/app.js \
            docs/PTU_COMBAT_MOVE_OUTCOMES.md \
            docs/data/PTU_COMBAT_MOVE_OUTCOMES.json
          if git diff --cached --quiet; then
            echo 'Controlled-Pokémon Move outcomes already current.'
          else
            git commit -m 'feat(combat): integrate controlled-Pokémon Move outcomes [skip ci]'
            git push origin HEAD:content/ptu-parametrized-forms-catalog
          fi
