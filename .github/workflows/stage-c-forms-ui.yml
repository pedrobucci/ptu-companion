name: Stage C Pokemon Forms UI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pokemon-forms-ui-c
    paths:
      - '.github/workflows/stage-c-forms-ui.yml'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_c_forms_ui.py'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_c_forms_followup.py'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_c_forms_ui.mjs'
      - 'PTU_Companion_Android_Tauri/scripts/verify-stage-c-forms-ui.mjs'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_a9_move_keywords.mjs'
      - 'PTU_Companion_Android_Tauri/scripts/verify-stage-a9-move-keywords.mjs'
      - 'PTU_Companion_Windows_Source/static-preview/app.js'
      - 'PTU_Companion_Android_Tauri/www/app.js'
      - 'PTU_Companion_Windows_Source/server.mjs'
      - 'PTU_Companion_Android_Tauri/www/mobile-api.mjs'
      - 'PTU_Companion_Windows_Source/package.json'
      - 'PTU_Companion_Android_Tauri/package.json'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Stage C Forms UI
        run: python PTU_Companion_Windows_Source/scripts/apply_stage_c_forms_ui.py

      - name: Apply Stage C Forms runtime follow-up
        run: python PTU_Companion_Windows_Source/scripts/apply_stage_c_forms_followup.py

      - name: Check patch formatting
        run: git diff --check

      - name: Verify Windows regressions
        working-directory: PTU_Companion_Windows_Source
        run: npm run verify

      - name: Verify Android regressions
        working-directory: PTU_Companion_Android_Tauri
        run: npm run verify

      - name: Commit Stage C runtime integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PTU_Companion_Windows_Source/static-preview/app.js \
            PTU_Companion_Android_Tauri/www/app.js \
            PTU_Companion_Windows_Source/server.mjs \
            PTU_Companion_Android_Tauri/www/mobile-api.mjs \
            PTU_Companion_Windows_Source/package.json \
            PTU_Companion_Android_Tauri/package.json
          if git diff --cached --quiet; then
            echo 'Stage C runtime integration already applied.'
          else
            git commit -m 'feat(stage-c): add Pokemon Forms UI [skip ci]'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
