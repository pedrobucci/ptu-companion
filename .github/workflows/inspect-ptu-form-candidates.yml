name: Inspect PTU Form Candidates

on:
  workflow_dispatch:
  push:
    branches:
      - content/ptu-parametrized-forms-catalog
    paths:
      - '.github/workflows/inspect-ptu-form-candidates.yml'
      - 'PTU_Companion_Windows_Source/scripts/inspect_ptu_form_candidates.py'
      - 'PTU_Companion_Windows_Source/scripts/build_ptu_forms_inventory.py'
      - 'PTU_Companion_Windows_Source/scripts/repair_ptu_forms_inventory.py'
      - 'PTU_Companion_Windows_Source/scripts/audit_ptu_form_discovery.py'
      - 'PTU_Companion_Windows_Source/scripts/audit_ptu_form_mechanics.py'
      - 'PTU_Companion_Windows_Source/scripts/classify_ptu_form_families.py'
      - 'PTU_Companion_Windows_Source/scripts/augment_ptu_embedded_permanent_families.py'
      - 'PTU_Companion_Windows_Source/scripts/audit_ptu_form_assets.py'
      - 'PTU_Companion_Windows_Source/scripts/generate_ptu_stage_b_forms.py'
      - 'PTU_Companion_Windows_Source/scripts/augment_ptu_embedded_permanent_stage_b.py'
      - 'PTU_Companion_Windows_Source/scripts/validate_ptu_forms_catalog.py'
      - 'PTU_Companion_Windows_Source/scripts/resolve_meloetta_form_rule.py'
      - 'PTU_Companion_Windows_Source/seed/content-packs/ptu-gen8ish-pokedex.ptucp'
      - 'PTU_Companion_Windows_Source/seed/content-packs/ptu-core-1.05.ptucp'
      - 'docs/PTU_FORM_SUPPLEMENTAL_RULES.md'
      - 'docs/data/PTU_FORM_SUPPLEMENTAL_RULES.json'
      - 'docs/PTU_FORMS_DEFERRED_SOURCE_REVIEW_3.md'
      - 'docs/data/PTU_FORMS_DEFERRED_SOURCE_REVIEW_3.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve source-backed Meloetta rule
        run: python PTU_Companion_Windows_Source/scripts/resolve_meloetta_form_rule.py
      - name: Inspect source pack
        run: python PTU_Companion_Windows_Source/scripts/inspect_ptu_form_candidates.py
      - name: Build audited forms inventory
        run: python PTU_Companion_Windows_Source/scripts/build_ptu_forms_inventory.py
      - name: Repair page-boundary source gaps and validate transforms
        run: python PTU_Companion_Windows_Source/scripts/repair_ptu_forms_inventory.py
      - name: Expand form discovery audit
        run: python PTU_Companion_Windows_Source/scripts/audit_ptu_form_discovery.py
      - name: Audit form-driving mechanics
        run: python PTU_Companion_Windows_Source/scripts/audit_ptu_form_mechanics.py
      - name: Classify form families
        run: python PTU_Companion_Windows_Source/scripts/classify_ptu_form_families.py
      - name: Add source-explicit embedded permanent families
        run: python PTU_Companion_Windows_Source/scripts/augment_ptu_embedded_permanent_families.py
      - name: Audit local form artwork
        run: python PTU_Companion_Windows_Source/scripts/audit_ptu_form_assets.py
      - name: Generate Stage B forms catalog
        run: python PTU_Companion_Windows_Source/scripts/generate_ptu_stage_b_forms.py
      - name: Materialize embedded permanent Stage B forms
        run: python PTU_Companion_Windows_Source/scripts/augment_ptu_embedded_permanent_stage_b.py
      - name: Validate catalog completeness
        run: python PTU_Companion_Windows_Source/scripts/validate_ptu_forms_catalog.py
      - name: Check generated inventory
        run: |
          test -s docs/PTU_FORMS_INVENTORY.md
          test -s docs/data/PTU_FORMS_INVENTORY.json
          test -s docs/PTU_FORMS_DISCOVERY.md
          test -s docs/data/PTU_FORMS_DISCOVERY.json
          test -s docs/PTU_FORM_MECHANICS_AUDIT.md
          test -s docs/data/PTU_FORM_MECHANICS_AUDIT.json
          test -s docs/PTU_FORMS_CLASSIFICATION.md
          test -s docs/data/PTU_FORMS_CLASSIFICATION.json
          test -s docs/PTU_FORM_SUPPLEMENTAL_RULES.md
          test -s docs/data/PTU_FORM_SUPPLEMENTAL_RULES.json
          test -s docs/PTU_FORM_ASSET_AUDIT.md
          test -s docs/data/PTU_FORM_ASSET_AUDIT.json
          test -s docs/PTU_FORMS_STAGE_B.md
          test -s docs/data/PTU_FORMS_STAGE_B.json
          test -s docs/PTU_FORMS_DEFERRED_SOURCE_REVIEW_3.md
          test -s docs/data/PTU_FORMS_DEFERRED_SOURCE_REVIEW_3.json
          grep -q '48 Mega forms across 46 Species' docs/PTU_FORMS_INVENTORY.md
          grep -q '2 Ultra Burst source blocks' docs/PTU_FORMS_INVENTORY.md
          grep -q 'NECROZMA Dusk Mane.*Neuroforce.*Illuminate.*Glow' docs/PTU_FORMS_INVENTORY.md
          grep -q 'NECROZMA Dawn Wings.*Neuroforce.*Illuminate.*Glow' docs/PTU_FORMS_INVENTORY.md
          grep -q 'Groudon' docs/PTU_FORMS_INVENTORY.md
          grep -q 'Kyogre' docs/PTU_FORMS_INVENTORY.md
          grep -q 'Swampert.*Swift Swim.*Atk +4' docs/PTU_FORMS_INVENTORY.md
          grep -q 'Beedrill.*Adaptability.*Atk +6' docs/PTU_FORMS_INVENTORY.md
          grep -q 'Metagross.*Tough Claws.*Atk +1' docs/PTU_FORMS_INVENTORY.md
          grep -q 'Pinsir.*Aerilate.*Gains Sky 6' docs/PTU_FORMS_INVENTORY.md
          grep -q 'Expanded source-signal candidates:.*106' docs/PTU_FORMS_DISCOVERY.md
          grep -q 'pumpkaboo.*embedded_size_forms:small,average,large,super' docs/PTU_FORMS_DISCOVERY.md
          grep -q 'gourgeist.*embedded_size_forms:small,average,large,super' docs/PTU_FORMS_DISCOVERY.md
          grep -q 'Form-driving Mechanics Audit' docs/PTU_FORM_MECHANICS_AUDIT.md
          grep -q 'Candidate records classified:.*106' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'Candidate families classified:.*69' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'Permanent/base families:.*36' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'Synthetic transform inventory:.*48 Mega.*2 Primal.*2 Ultra Burst' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'Transformation families:.*5' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'Persistent-form families:.*2' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'Runtime-state families:.*6' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'Deferred/source-insufficient families:.*10' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'False-positive families:.*5' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'pumpkaboo.*permanent.*baseFormId.*source_explicit_variant' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'gourgeist.*permanent.*baseFormId.*source_explicit_variant' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'deerling.*runtime_state.*runtime_resolver.*source_explicit' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'sawsbuck.*runtime_state.*runtime_resolver.*source_explicit' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'meloetta.*transformation.*activeFormId.*source_explicit' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'Meloetta.*Relic Song.*PTU Core 1.05 p.405.*transformation' docs/PTU_FORM_SUPPLEMENTAL_RULES.md
          grep -q 'Aegislash.*Stance Change.*PTU Core 1.05 p.331.*transformation' docs/PTU_FORM_SUPPLEMENTAL_RULES.md
          grep -q 'Burmy.*Quick Cloak.*PTU Core 1.05 p.327.*persistent form' docs/PTU_FORM_SUPPLEMENTAL_RULES.md
          grep -q 'Furfrou.*Fabulous Trim.*PTU Core 1.05 p.317.*persistent form' docs/PTU_FORM_SUPPLEMENTAL_RULES.md
          grep -q 'Basculin.*Gen 8ish PokéDex p.764.*permanent' docs/PTU_FORM_SUPPLEMENTAL_RULES.md
          grep -q 'Deerling / Sawsbuck.*Seasonal.*runtime state' docs/PTU_FORM_SUPPLEMENTAL_RULES.md
          grep -q 'cramorant.*false_positive' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'mimikyu.*false_positive.*source_explicit_non_form' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'wishiwashi.*transformation' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'silvally.*runtime_state' docs/PTU_FORMS_CLASSIFICATION.md
          grep -q 'Rule-defined family entries:.*11' docs/PTU_FORMS_STAGE_B.md
          grep -q 'Rule-defined forms:.*30' docs/PTU_FORMS_STAGE_B.md
          grep -q 'Candidate-record/derived Stage B forms emitted:.*67' docs/PTU_FORMS_STAGE_B.md
          grep -q 'Record-backed forms:.*37' docs/PTU_FORMS_STAGE_B.md
          grep -q 'aegislash.*rule_defined_stance_change.*Sword Stance' docs/PTU_FORMS_STAGE_B.md
          grep -q 'burmy.*rule_defined_quick_cloak.*Plant Cloak.*Sandy Cloak.*Trash Cloak' docs/PTU_FORMS_STAGE_B.md
          grep -q 'furfrou.*rule_defined_fabulous_trim.*Star Trim.*Debutante Trim' docs/PTU_FORMS_STAGE_B.md
          grep -q 'basculin.*embedded_color_ability_variant.*Red.*Blue' docs/PTU_FORMS_STAGE_B.md
          grep -q 'wishiwashi.*rule_defined_schooling.*Schooling Forme' docs/PTU_FORMS_STAGE_B.md
          grep -q 'minior.*rule_defined_shields_down.*Core Forme' docs/PTU_FORMS_STAGE_B.md
          grep -q 'eiscue.*rule_defined_ice_face.*Noice Face' docs/PTU_FORMS_STAGE_B.md
          grep -q 'meloetta.*rule_defined_relic_song.*Step Forme' docs/PTU_FORMS_STAGE_B.md
          grep -q 'wormadam.*source_record_cloak_forms.*Plant Cloak.*Sandy Cloak.*Trash Cloak' docs/PTU_FORMS_STAGE_B.md
          grep -q 'pumpkaboo.*embedded_size_base_stats.*Small.*Average.*Large.*Super' docs/PTU_FORMS_STAGE_B.md
          grep -q 'gourgeist.*embedded_size_base_stats.*Small.*Average.*Large.*Super' docs/PTU_FORMS_STAGE_B.md
          grep -q 'Mega transforms:.*48' docs/PTU_FORMS_STAGE_B.md
          grep -q 'Primal transforms:.*2' docs/PTU_FORMS_STAGE_B.md
          grep -q 'Ultra Burst transforms:.*2' docs/PTU_FORMS_STAGE_B.md
          grep -q 'No artwork URL is generated' docs/PTU_FORMS_STAGE_B.md
          grep -q 'exact per-size measurements are not fabricated' docs/PTU_FORMS_STAGE_B.md
          grep -q 'Families reclassified in this pass:.*0' docs/PTU_FORMS_DEFERRED_SOURCE_REVIEW_3.md
          grep -q 'Families still deferred:.*10' docs/PTU_FORMS_DEFERRED_SOURCE_REVIEW_3.md
          git diff --exit-code -- '*.ptucp'
          git diff --check
      - name: Commit generated inventory
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PTU_FORMS_INVENTORY.md docs/data/PTU_FORMS_INVENTORY.json docs/PTU_FORMS_DISCOVERY.md docs/data/PTU_FORMS_DISCOVERY.json docs/PTU_FORM_MECHANICS_AUDIT.md docs/data/PTU_FORM_MECHANICS_AUDIT.json docs/PTU_FORMS_CLASSIFICATION.md docs/data/PTU_FORMS_CLASSIFICATION.json docs/PTU_FORM_ASSET_AUDIT.md docs/data/PTU_FORM_ASSET_AUDIT.json docs/PTU_FORMS_STAGE_B.md docs/data/PTU_FORMS_STAGE_B.json
          if git diff --cached --quiet; then
            echo 'Forms audit artifacts already current.'
          else
            git commit -m 'docs(content): refresh PTU forms catalog [skip ci]'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
