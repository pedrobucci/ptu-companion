name: Stage B Combat Sprint Maneuver

on:
  workflow_dispatch:
  push:
    branches:
      - content/ptu-parametrized-forms-catalog
    paths:
      - '.github/workflows/stage-b-combat-sprint-maneuver.yml'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_session_fixups.py'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_non_move_resources.py'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_ability_actions.py'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_non_move_session_docs.py'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_sprint_maneuver.py'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_session_ledger.mjs'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_non_move_resources.mjs'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_ability_actions.mjs'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_sprint_maneuver.mjs'
      - 'PTU_Companion_Windows_Source/static-preview/app.js'
      - 'PTU_Companion_Android_Tauri/www/app.js'
      - 'docs/PTU_COMBAT_SESSION_LEDGER.md'
      - 'docs/data/PTU_COMBAT_SESSION_LEDGER.json'
      - 'docs/PTU_COMBAT_ABILITY_ACTIONS.md'
      - 'docs/data/PTU_COMBAT_ABILITY_ACTIONS.json'
      - 'docs/PTU_COMBAT_SPRINT_MANEUVER.md'
      - 'docs/data/PTU_COMBAT_SPRINT_MANEUVER.json'

permissions:
  contents: write

jobs:
  sprint-maneuver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ptu-parametrized-forms-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild deterministic Combat layers
        run: python PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_session_fixups.py
      - name: Verify shared Combat ledger
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_session_ledger.mjs
      - name: Verify shared non-Move resources
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_non_move_resources.mjs
      - name: Verify source-explicit Ability actions
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_ability_actions.mjs
      - name: Verify Sprint composite Maneuver + Ability
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_sprint_maneuver.mjs
      - name: Verify Windows regressions
        working-directory: PTU_Companion_Windows_Source
        run: npm run verify
      - name: Verify Android regressions
        working-directory: PTU_Companion_Android_Tauri
        run: npm run verify
      - name: Check Sprint invariants
        run: |
          grep -q 'function pokemonCombatSprintCompositeAvailability' PTU_Companion_Windows_Source/static-preview/app.js
          grep -q 'function pokemonCombatSprintCompositeAvailability' PTU_Companion_Android_Tauri/www/app.js
          grep -q "section('MANEUVERS'" PTU_Companion_Windows_Source/static-preview/app.js
          grep -q 'Sprint + Ability · Standard + Swift · Scene' PTU_Companion_Android_Tauri/www/app.js
          grep -q '"standard_to_swift_during_composite": false' docs/data/PTU_COMBAT_SESSION_LEDGER.json
          grep -q '"action_cost": "Standard Action"' docs/data/PTU_COMBAT_SPRINT_MANEUVER.json
          grep -q '"action_cost": "Swift Action"' docs/data/PTU_COMBAT_SPRINT_MANEUVER.json
          grep -q 'Composite action economy' docs/PTU_COMBAT_SPRINT_MANEUVER.md
          grep -q 'integrated by the composite Sprint Maneuver layer' docs/data/PTU_COMBAT_ABILITY_ACTIONS.json
          ! grep -q 'async async function ' PTU_Companion_Windows_Source/static-preview/app.js
          ! grep -q 'async async function ' PTU_Companion_Android_Tauri/www/app.js
          git diff --exit-code -- '*.ptucp'
          git diff --check
      - name: Commit Sprint runtime/docs refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH='content/ptu-parametrized-forms-catalog'
          GENERATED=(
            PTU_Companion_Windows_Source/static-preview/app.js
            PTU_Companion_Android_Tauri/www/app.js
            docs/PTU_COMBAT_SESSION_LEDGER.md
            docs/data/PTU_COMBAT_SESSION_LEDGER.json
            docs/PTU_COMBAT_NON_MOVE_RESOURCES.md
            docs/data/PTU_COMBAT_NON_MOVE_RESOURCES.json
            docs/PTU_COMBAT_ABILITY_ACTIONS.md
            docs/data/PTU_COMBAT_ABILITY_ACTIONS.json
            docs/PTU_COMBAT_SPRINT_MANEUVER.md
            docs/data/PTU_COMBAT_SPRINT_MANEUVER.json
          )
          for attempt in 1 2 3; do
            git add "${GENERATED[@]}"
            if git diff --cached --quiet; then
              echo 'Sprint composite runtime already current.'
              exit 0
            fi
            git commit -m 'feat(combat): integrate Sprint Maneuver and Ability [skip ci]'
            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            echo "Generated push raced with another workflow; refreshing from origin (attempt $attempt/3)."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_session_fixups.py
          done
          echo 'Unable to publish deterministic Sprint refresh after 3 attempts.' >&2
          exit 1
