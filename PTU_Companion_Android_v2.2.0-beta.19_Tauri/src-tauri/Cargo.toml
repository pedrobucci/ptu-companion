[package]
name = "ptu-companion"
version = "2.2.0-beta.19"
description = "PTU Companion - offline companion for Pokemon Tabletop United"
authors = ["PTU Companion contributors"]
edition = "2021"

[lib]
name = "ptu_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

zip = { version = "0.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"
