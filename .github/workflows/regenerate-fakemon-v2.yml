name: Regenerate Fakemon v2 defaults

on:
  workflow_dispatch:
  push:
    branches:
      - content/fakemon-1-leva-v2
    paths:
      - '.github/workflows/regenerate-fakemon-v2.yml'
      - 'PTU_Companion_Windows_Source/scripts/add_fakemon_1_leva.mjs'
      - 'PTU_Companion_Windows_Source/scripts/extract_fakemon_1_leva_art.py'
      - 'PTU_Companion_Windows_Source/scripts/build_fakemon_1_leva_pack.py'
      - 'PTU_Companion_Windows_Source/scripts/verify_fakemon_1_leva_v2.mjs'
      - 'PTU_Companion_Windows_Source/docs/source/Fakemon_1_leva.pdf'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/fakemon-1-leva-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install artwork extraction dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow

      - name: Extract species artwork from source PDF
        run: python PTU_Companion_Windows_Source/scripts/extract_fakemon_1_leva_art.py

      - name: Regenerate default definition databases
        run: node PTU_Companion_Windows_Source/scripts/add_fakemon_1_leva.mjs

      - name: Build v2 PTU content packs
        run: python PTU_Companion_Windows_Source/scripts/build_fakemon_1_leva_pack.py

      - name: Remove superseded v1.1 bundled packs
        shell: bash
        run: |
          rm -f PTU_Companion_Windows_Source/bundled-packs/campaign-homebrew-fakemon-1-leva-1.1.0.ptucp
          rm -f PTU_Companion_Windows_Source/bundled-packs/campaign-homebrew-fakemon-1-leva-1.1.0_SHA256.txt
          rm -f PTU_Companion_Android_Tauri/bundled-packs/campaign-homebrew-fakemon-1-leva-1.1.0.ptucp
          rm -f PTU_Companion_Android_Tauri/bundled-packs/campaign-homebrew-fakemon-1-leva-1.1.0_SHA256.txt

      - name: Verify v2 content
        run: node PTU_Companion_Windows_Source/scripts/verify_fakemon_1_leva_v2.mjs

      - name: Cross-check all default databases
        shell: bash
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          dbs = [
              Path('PTU_Companion_Windows_Source/seed/definitions/ptu_seed_v1.0.sqlite3'),
              Path('PTU_Companion_Windows_Source/data/definitions/ptu_definitions.sqlite3'),
              Path('seed/ptu_seed_v1.0.sqlite3'),
          ]
          for path in dbs:
              con = sqlite3.connect(path)
              rows = dict(con.execute("select definition_kind,count(*) from definition_versions where content_pack_id='campaign-homebrew-fakemon-1-leva' group by definition_kind"))
              version = con.execute("select version from content_packs where id='campaign-homebrew-fakemon-1-leva'").fetchone()
              con.close()
              assert rows.get('species') == 13, (path, rows)
              assert rows.get('moves') == 8, (path, rows)
              assert rows.get('abilities') == 3, (path, rows)
              assert version and version[0] == '2.0.0', (path, version)
              print(path, rows, version[0])
          PY

      - name: Commit generated defaults, artwork and packs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'chore(content): regenerate Fakemon v2 defaults [skip ci]'
            git push origin HEAD:content/fakemon-1-leva-v2
          fi
