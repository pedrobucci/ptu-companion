name: Stage B Form Requirements V2

on:
  workflow_dispatch:
  push:
    branches:
      - content/ptu-parametrized-forms-catalog
    paths:
      - '.github/workflows/stage-b-form-requirements-v2.yml'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_form_requirements_v2.py'
      - 'PTU_Companion_Windows_Source/scripts/augment_ptu_runtime_requirements.py'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_b_form_requirements_v2.mjs'

permissions:
  contents: write

jobs:
  requirements-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ptu-parametrized-forms-catalog
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply shared Windows Android requirement runtime
        run: python PTU_Companion_Windows_Source/scripts/apply_stage_b_form_requirements_v2.py

      - name: Upgrade Stage B source-explicit requirements
        run: python PTU_Companion_Windows_Source/scripts/augment_ptu_runtime_requirements.py

      - name: Verify requirement model v2
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_form_requirements_v2.mjs

      - name: Verify Windows regressions
        working-directory: PTU_Companion_Windows_Source
        run: npm run verify

      - name: Verify Android regressions
        working-directory: PTU_Companion_Android_Tauri
        run: npm run verify

      - name: Check source and pack safety
        run: |
          grep -q 'Runtime requirement model:.*2' docs/PTU_FORMS_STAGE_B.md
          grep -q 'Forms upgraded from review-only manual gates to structured source requirements:.*8' docs/PTU_FORMS_STAGE_B.md
          grep -q 'wishiwashi:schooling.*Schooling' docs/PTU_FORMS_STAGE_B.md
          grep -q 'minior:core.*half maximum HP' docs/PTU_FORMS_STAGE_B.md
          grep -q 'eiscue:noice-face.*Temporary HP' docs/PTU_FORMS_STAGE_B.md
          grep -q 'meloetta:step-forme.*Relic Song' docs/PTU_FORMS_STAGE_B.md
          grep -q 'zygarde:complete-from-\*.*Power Construct' docs/PTU_FORMS_STAGE_B.md
          grep -q 'zacian:crowned-sword.*zamazenta:crowned-shield' docs/PTU_FORMS_STAGE_B.md
          git diff --exit-code -- '*.ptucp'
          git diff --check

      - name: Commit requirement runtime integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PTU_Companion_Windows_Source/rules/pokemon-forms.mjs \
            PTU_Companion_Android_Tauri/www/rules/pokemon-forms.mjs \
            PTU_Companion_Windows_Source/server.mjs \
            PTU_Companion_Android_Tauri/www/mobile-api.mjs \
            docs/PTU_FORMS_STAGE_B.md \
            docs/data/PTU_FORMS_STAGE_B.json
          if git diff --cached --quiet; then
            echo 'Requirement runtime integration already current.'
          else
            git commit -m 'feat(forms): integrate source-explicit runtime requirements [skip ci]'
            git push origin HEAD:content/ptu-parametrized-forms-catalog
          fi
