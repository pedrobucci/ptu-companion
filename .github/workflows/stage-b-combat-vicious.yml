name: Stage B Combat Vicious

on:
  workflow_dispatch:
  push:
    branches:
      - content/ptu-parametrized-forms-catalog
    paths:
      - '.github/workflows/stage-b-combat-vicious.yml'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_session_fixups.py'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_vicious.py'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_vicious.mjs'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_non_move_resources.mjs'
      - 'PTU_Companion_Windows_Source/static-preview/app.js'
      - 'PTU_Companion_Android_Tauri/www/app.js'
      - 'docs/PTU_COMBAT_VICIOUS.md'
      - 'docs/data/PTU_COMBAT_VICIOUS.json'
      - 'docs/PTU_COMBAT_SESSION_LEDGER.md'
      - 'docs/data/PTU_COMBAT_SESSION_LEDGER.json'

permissions:
  contents: write

jobs:
  vicious:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ptu-parametrized-forms-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild deterministic Combat layers
        run: |
          python PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_session_fixups.py
          python PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_vicious.py
      - name: Verify shared Combat ledger
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_session_ledger.mjs
      - name: Verify shared non-Move resources
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_non_move_resources.mjs
      - name: Verify Quick Curl regression
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_quick_curl.mjs
      - name: Verify Vicious triggered connection
        run: node PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_vicious.mjs
      - name: Verify Windows regressions
        working-directory: PTU_Companion_Windows_Source
        run: npm run verify
      - name: Verify Android regressions
        working-directory: PTU_Companion_Android_Tauri
        run: npm run verify
      - name: Check Vicious invariants
        run: |
          grep -q 'function pokemonCombatViciousAbilityResourceSpec' PTU_Companion_Windows_Source/static-preview/app.js
          grep -q 'function pokemonCombatViciousAbilityResourceSpec' PTU_Companion_Android_Tauri/www/app.js
          grep -q 'function pokemonCombatStandardRemaining' PTU_Companion_Windows_Source/static-preview/app.js
          grep -q 'function pokemonCombatStandardRemaining' PTU_Companion_Android_Tauri/www/app.js
          grep -q "section('VICIOUS · HONE CLAWS'" PTU_Companion_Windows_Source/static-preview/app.js
          grep -q "section('VICIOUS · HONE CLAWS'" PTU_Companion_Android_Tauri/www/app.js
          grep -q 'Bonus Standard → Swift' PTU_Companion_Windows_Source/static-preview/app.js
          grep -q 'Bonus Standard → Swift' PTU_Companion_Android_Tauri/www/app.js
          grep -q '"physical_dice_only": true' docs/data/PTU_COMBAT_VICIOUS.json
          grep -q 'Electrodash was rejected' docs/PTU_COMBAT_VICIOUS.md
          grep -q 'Vicious + Hone Claws triggered connection' docs/PTU_COMBAT_SESSION_LEDGER.md
          ! grep -q 'async async function ' PTU_Companion_Windows_Source/static-preview/app.js
          ! grep -q 'async async function ' PTU_Companion_Android_Tauri/www/app.js
          git diff --exit-code -- '*.ptucp'
          git diff --check
      - name: Commit Vicious runtime/docs refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH='content/ptu-parametrized-forms-catalog'
          GENERATED=(
            PTU_Companion_Windows_Source/static-preview/app.js
            PTU_Companion_Android_Tauri/www/app.js
            docs/PTU_COMBAT_VICIOUS.md
            docs/data/PTU_COMBAT_VICIOUS.json
            docs/PTU_COMBAT_SESSION_LEDGER.md
            docs/data/PTU_COMBAT_SESSION_LEDGER.json
          )
          for attempt in 1 2 3; do
            git add "${GENERATED[@]}"
            if git diff --cached --quiet; then
              echo 'Vicious Combat runtime already current.'
              exit 0
            fi
            git commit -m 'feat(combat): integrate Vicious and Hone Claws [skip ci]'
            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            echo "Generated push raced with another workflow; refreshing from origin (attempt $attempt/3)."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_session_fixups.py
            python PTU_Companion_Windows_Source/scripts/apply_stage_b_combat_vicious.py
            node PTU_Companion_Windows_Source/scripts/verify_stage_b_combat_vicious.mjs
          done
          echo 'Unable to publish deterministic Vicious refresh after 3 attempts.' >&2
          exit 1
