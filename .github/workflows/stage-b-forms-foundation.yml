name: Stage B Pokemon Forms Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pokemon-forms-foundation-b
    paths:
      - '.github/workflows/stage-b-forms-foundation.yml'
      - 'PTU_Companion_Windows_Source/rules/pokemon-forms.mjs'
      - 'PTU_Companion_Android_Tauri/www/rules/pokemon-forms.mjs'
      - 'PTU_Companion_Windows_Source/scripts/apply_stage_b_forms_foundation.py'
      - 'PTU_Companion_Windows_Source/scripts/prepare_stage_b_forms_patcher.py'
      - 'PTU_Companion_Windows_Source/scripts/verify_stage_b_forms_foundation.mjs'
      - 'PTU_Companion_Android_Tauri/scripts/verify-stage-b-forms-foundation.mjs'
      - 'PTU_Companion_Windows_Source/definitions/repository.mjs'
      - 'PTU_Companion_Windows_Source/definitions/pack-importer.mjs'
      - 'PTU_Companion_Windows_Source/server.mjs'
      - 'PTU_Companion_Android_Tauri/www/mobile-api.mjs'
      - 'PTU_Companion_Windows_Source/package.json'
      - 'PTU_Companion_Android_Tauri/package.json'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Stage B patcher
        run: python PTU_Companion_Windows_Source/scripts/prepare_stage_b_forms_patcher.py

      - name: Apply Stage B Forms foundation
        run: python PTU_Companion_Windows_Source/scripts/apply_stage_b_forms_foundation.py

      - name: Check patch formatting
        run: git diff --check

      - name: Verify Windows regressions
        working-directory: PTU_Companion_Windows_Source
        run: npm run verify

      - name: Verify Android regressions
        working-directory: PTU_Companion_Android_Tauri
        run: npm run verify

      - name: Commit Stage B runtime integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PTU_Companion_Windows_Source/scripts/apply_stage_b_forms_foundation.py \
            PTU_Companion_Windows_Source/definitions/repository.mjs \
            PTU_Companion_Windows_Source/definitions/pack-importer.mjs \
            PTU_Companion_Windows_Source/server.mjs \
            PTU_Companion_Android_Tauri/www/mobile-api.mjs \
            PTU_Companion_Windows_Source/package.json \
            PTU_Companion_Android_Tauri/package.json
          if git diff --cached --quiet; then
            echo 'Stage B runtime integration already applied.'
          else
            git commit -m 'feat(stage-b): integrate Pokemon Forms foundation [skip ci]'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
