<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0878db" />
  <title>PTU Companion Android</title>
  <script>
    (function(){
      function showStartupError(kind, value){
        try {
          var text = value && (value.stack || value.message) ? (value.stack || value.message) : String(value || 'Unknown error');
          console.error('[PTU Android startup]', kind, value);
          window.__PTU_STARTUP_ERROR__ = { kind: kind, text: text };
          setTimeout(function(){
            var root=document.getElementById('app');
            if(!root) return;
            root.innerHTML='<div style="min-height:100vh;padding:24px;box-sizing:border-box;background:#0a67b7;color:white;font-family:system-ui"><h2>PTU Companion could not finish loading</h2><p>This is a frontend startup error, not an Android installation error.</p><pre style="white-space:pre-wrap;background:rgba(0,0,0,.25);padding:12px;border-radius:10px;overflow:auto">'+text.replace(/[&<>]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];})+'</pre></div>';
          },0);
        } catch (_) {}
      }
      window.addEventListener('error', function(e){ showStartupError('error', e.error || e.message); });
      window.addEventListener('unhandledrejection', function(e){ showStartupError('unhandledrejection', e.reason); });
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="ptu-android-body">
  <div id="app"><div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui;background:#0878db;color:#fff"><div style="text-align:center"><div style="font-size:52px">◉</div><h2>PTU Companion</h2><p>Loading Android player edition…</p></div></div></div>
  <script src="mobile-data.js"></script>
  <script src="mobile-runtime.js"></script>
</body>
</html>
